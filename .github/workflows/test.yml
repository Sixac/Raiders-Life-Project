# Runs the checks on every pull request, so problems show up before merging. That includes a
# pull request made on top of another one, which targets that one's branch until it is merged.
# (Pushes to master are tested by the deploy workflow before it publishes.)
name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
